[book]
title = "Kubernetes: From Zero to Production"
authors = ["Vishvam Moliya"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "" # TODO: Set to actual GitHub repository URL
additional-css = ["src/custom.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js", "diagram-modal.js", "progress-bar.js", "back-to-top.js"]
no-section-label = false

[output.html.search]
enable = true
limit-results = 30

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html.playground]
editable = false
